<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6f42c1"/>
      <stop offset="100%" stop-color="#4c2889"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with Violet Gradient -->
  <rect x="5" y="5" width="110" height="110" rx="30" fill="url(#brandGrad)"/>
  <rect x="5" y="5" width="110" height="110" rx="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Antenna with Glowing Cyan Orb -->
  <line x1="60" y1="18" x2="60" y2="28" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="16" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)"/>

  <!-- Robot Head Silhouette -->
  <rect x="30" y="27" width="60" height="42" rx="14" fill="#ffffff"/>
  
  <!-- Ear Headphone Nodes -->
  <rect x="23" y="35" width="7" height="24" rx="3.5" fill="#38bdf8"/>
  <rect x="90" y="35" width="7" height="24" rx="3.5" fill="#38bdf8"/>
  
  <!-- Dark Visor Screen -->
  <rect x="36" y="34" width="48" height="28" rx="9" fill="#0f172a"/>
  
  <!-- Happy Visor Eyes -->
  <path d="M 43 49 Q 48 41 53 49" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#subtleGlow)"/>
  <path d="M 67 49 Q 72 41 77 49" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Developer Hoodie Base -->
  <path d="M 27 79 Q 27 71 38 71 L 82 71 Q 93 71 93 79 L 98 104 Q 98 106 95 106 L 25 106 Q 22 106 22 104 Z" fill="#1b1238"/>
  <path d="M 38 72 L 60 86 L 82 72" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Code Bracket </> Glyph -->
  <path d="M 47 90 L 41 95 L 47 100" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 73 90 L 79 95 L 73 100" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="63" y1="89" x2="57" y2="101" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
</svg>
